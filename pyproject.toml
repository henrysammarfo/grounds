# GROUNDS contest Python package — claim verification agent
# Python 3.11+ recommended (tested on 3.13)

[project]
name = "grounds"
version = "0.5.0"
description = "Verify engineering claims against the real repository"
readme = "REPRO.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "openai>=1.40.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
grounds-baseline = "baseline.run:main"
grounds-agent = "agent.run:main"
grounds-eval = "eval.score:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "baseline*", "eval*", "grounds_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
